<svg width="840" height="85" viewBox="0 0 840 85" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="soc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e131b"/>
    </linearGradient>
    <linearGradient id="ig_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
  </defs>

  <!-- 1. Instagram -->
  <g transform="translate(15, 12)">
    <rect width="150" height="60" rx="12" fill="url(#soc_bg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#ig_grad)"/>
    <text x="75" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">INSTAGRAM</text>
    <text x="75" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e1306c" text-anchor="middle">@wespcai</text>
  </g>

  <!-- 2. YouTube -->
  <g transform="translate(180, 12)">
    <rect width="150" height="60" rx="12" fill="url(#soc_bg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#ff0000"/>
    <text x="75" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">YOUTUBE</text>
    <text x="75" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d4d" text-anchor="middle">@wespcai</text>
  </g>

  <!-- 3. TikTok -->
  <g transform="translate(345, 12)">
    <rect width="150" height="60" rx="12" fill="url(#soc_bg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#00f2fe"/>
    <text x="75" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">TIKTOK</text>
    <text x="75" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#25f4ee" text-anchor="middle">@wespcai</text>
  </g>

  <!-- 4. Discord -->
  <g transform="translate(510, 12)">
    <rect width="150" height="60" rx="12" fill="url(#soc_bg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#5865F2"/>
    <text x="75" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">DISCORD</text>
    <text x="75" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7289da" text-anchor="middle">wespcai</text>
  </g>

  <!-- 5. GitHub -->
  <g transform="translate(675, 12)">
    <rect width="150" height="60" rx="12" fill="url(#soc_bg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#f0f6fc"/>
    <text x="75" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">GITHUB</text>
    <text x="75" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">@emrewyt</text>
  </g>
</svg>
