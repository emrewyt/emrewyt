<svg width="840" height="180" viewBox="0 0 840 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="quote_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ffa502"/>
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect x="1" y="1" width="838" height="178" rx="14" fill="url(#term_bg)" stroke="#232838" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="178" rx="14" fill="none" stroke="#ff3344" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Top Terminal Header -->
  <circle cx="26" cy="24" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#27c93f"/>
  
  <text x="84" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8b949e" letter-spacing="1.2">WESPCAI // PHILOSOPHY &amp; CRAFT</text>
  <text x="740" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#8b949e">zsh ●</text>

  <line x1="15" y1="44" x2="825" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- Philosophy Text -->
  <text x="32" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#ff4757" font-weight="bold">"Tonight's the night. And it's going to happen again and again."</text>
  
  <text x="32" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#c9d1d9">
    Karmaşık soyutlamaların arkasına saklanmadan, sistemin nasıl çalıştığını derinlemesine anlamak;
  </text>
  <text x="32" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#c9d1d9">
    düşük seviyeli kontrolü modern masaüstü ve oyun mimarileriyle birleştirerek amaca hizmet eden yazılımlar üretmek.
  </text>

  <!-- Bottom Terminal Tag -->
  <text x="32" y="156" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#6e7681">
    $ echo "understand the system · break the unnecessary · rebuild with aesthetic precision"
  </text>
</svg>
